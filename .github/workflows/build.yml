name: Build Vocal Flow (VST3, macOS)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necesario para adjuntar el .zip a una Release cuando se sube un tag

jobs:
  build:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          cd build/VocalFlow_artefacts/Release/VST3
          ditto -c -k --keepParent "Vocal Flow.vst3" "$GITHUB_WORKSPACE/VocalFlow-macOS-VST3.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalFlow-macOS-VST3
          path: VocalFlow-macOS-VST3.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VocalFlow-macOS-VST3.zip
